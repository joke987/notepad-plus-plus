<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Block Breaker</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #111;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="360" height="640"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let paddle = {
      x: canvas.width / 2 - 40,
      y: canvas.height - 30,
      width: 80,
      height: 10,
      dx: 0
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      dx: 4,
      dy: -4
    };

    const blockRowCount = 5;
    const blockColumnCount = 6;
    const blockWidth = 50;
    const blockHeight = 20;
    const blockPadding = 10;
    const blockOffsetTop = 40;
    const blockOffsetLeft = 15;

    let blocks = [];
    for (let r = 0; r < blockRowCount; r++) {
      for (let c = 0; c < blockColumnCount; c++) {
        blocks.push({
          x: c * (blockWidth + blockPadding) + blockOffsetLeft,
          y: r * (blockHeight + blockPadding) + blockOffsetTop,
          status: 1
        });
      }
    }

    function drawBlocks() {
      ctx.fillStyle = "magenta";
      blocks.forEach(block => {
        if (block.status) {
          ctx.fillRect(block.x, block.y, blockWidth, blockHeight);
        }
      });
    }

    function drawPaddle() {
      ctx.fillStyle = "white";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.fillStyle = "cyan";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function moveBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall collision
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx *= -1;
      }
      if (ball.y - ball.radius < 0) {
        ball.dy *= -1;
      }

      // Paddle collision
      if (
        ball.y + ball.radius > paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
      ) {
        ball.dy *= -1;
      }

      // Bottom = reset
      if (ball.y + ball.radius > canvas.height) {
        resetGame();
      }

      // Block collision
      blocks.forEach(block => {
        if (block.status) {
          if (
            ball.x > block.x &&
            ball.x < block.x + blockWidth &&
            ball.y > block.y &&
            ball.y < block.y + blockHeight
          ) {
            ball.dy *= -1;
            block.status = 0;
          }
        }
      });
    }

    function resetGame() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = 4;
      ball.dy = -4;
      blocks.forEach(b => (b.status = 1));
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPaddle();
      drawBall();
      drawBlocks();
      moveBall();

      paddle.x += paddle.dx;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      requestAnimationFrame(update);
    }

    document.addEventListener("touchmove", (e) => {
      const touchX = e.touches[0].clientX;
      paddle.x = touchX - paddle.width / 2;
    });

    update();
  </script>
</body>
</html>
